services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  api:
    build: ./api
    env_file:
      - ./api/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/compliance_manager
    depends_on:
      - mongo
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mongo_data:
